services:
  - type: web
    name: the-chancellors-business-growth-desk
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    numInstances: 1
    disk:
      name: growth-desk-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_URL
        value: https://the-chancellor.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_VOICE
        value: cedar
      - key: PAYFAST_MODE
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: CASE_PLATFORM_FEE_RATE
        value: "0.10"
      - key: RESEND_API_KEY
        sync: false
      - key: COMMS_FROM_EMAIL
        sync: false
      - key: COMMS_MOBILE_CHANNEL
        value: sms
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: ADMIN_ALERT_PHONE
        sync: false
      - key: COMMS_SCAN_INTERVAL_MINUTES
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: MAX_DELIVERABLE_MB
        value: "20"
      - key: ALLOWED_UPLOAD_TYPES
        value: application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
