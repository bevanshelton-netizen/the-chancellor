services:
  the-chancellor:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: the-chancellor
    restart: unless-stopped
    env_file:
      - ./the-chancellor.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      IZAKHONO_RUNTIME: "true"
      IZAKHONO_RUNTIME_CLASS: ${IZAKHONO_RUNTIME_CLASS:-owned}
      IZAKHONO_RUNTIME_ID: ${IZAKHONO_RUNTIME_ID:-owned-runtime}
      IZAKHONO_RELEASE_VERSION: ${IZAKHONO_RELEASE_VERSION:-v1-commercial}
      IZAKHONO_RELEASE_ID: ${IZAKHONO_RELEASE_ID:-unknown}
      IZAKHONO_DATA_SCHEMA_VERSION: ${IZAKHONO_DATA_SCHEMA_VERSION:-1}
      PERSISTENT_STORAGE: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - the_chancellor_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  the_chancellor_data:
    name: the_chancellor_data
