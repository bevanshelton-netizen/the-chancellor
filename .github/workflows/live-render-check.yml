name: Legacy Render Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify legacy Render service on demand
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://the-chancellor.onrender.com'
          echo 'Legacy diagnostic only. IZAKHONO Sovereign Node is the production deployment path.'
          hcode=$(curl -L --connect-timeout 10 --max-time 25 -sS -o /tmp/health.json -w '%{http_code}' "$BASE/api/health" || true)
          echo "Legacy Render /api/health -> HTTP $hcode"
          cat /tmp/health.json 2>/dev/null || true
          [ "$hcode" = '200' ]
