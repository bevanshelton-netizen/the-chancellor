name: Chancellor v1 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check JavaScript
        shell: bash
        run: |
          failed=0
          while IFS= read -r -d '' file; do
            if ! output=$(node --check "$file" 2>&1); then
              message=$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error file=${file#./}::${message}"
              failed=1
            fi
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)
          exit "$failed"
      - name: Core integrity tests
        run: npm test
