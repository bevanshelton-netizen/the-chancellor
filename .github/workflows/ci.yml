name: Chancellor v1 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax check JavaScript
        run: find . -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Core integrity tests
        run: npm test
