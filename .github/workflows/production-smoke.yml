name: Production Smoke Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Syntax check server files
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run core tests
        run: npm test

      - name: Boot application and smoke test public paths
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export PORT=3000
          export DATA_DIR=/tmp/chancellor-data
          export SESSION_SECRET='ci-only-session-secret-0123456789abcdefghijklmnopqrstuvwxyz'
          export APP_URL='http://127.0.0.1:3000'
          export PAYFAST_MODE='sandbox'
          node revenue-server.js > /tmp/chancellor-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/chancellor-server.log
            exit 1
          fi

          grep -q '"ok":true' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/ | grep -q "The Chancellor"
          curl -fsS http://127.0.0.1:3000/campaign.html | grep -q 'R500 Business Readiness Audit'
          curl -fsS http://127.0.0.1:3000/portal.html | grep -q 'Client'
          curl -fsS http://127.0.0.1:3000/brand/crest.jpg > /dev/null
          curl -fsS http://127.0.0.1:3000/assets/chancellor-approved-live.webp > /dev/null

          kill "$PID"
          wait "$PID" || true
          trap - EXIT
