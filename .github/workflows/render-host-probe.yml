name: Render Host Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/render-host-probe.yml'
      - 'render.yaml'
      - 'Dockerfile'
      - 'render-start.js'
      - 'server.js'
      - 'revenue-server.js'
      - 'go-live-routes.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for external backend health
        shell: bash
        run: |
          set -u
          BASE='https://the-chancellor.onrender.com'
          HEALTH="$BASE/api/health"
          READY="$BASE/api/go-live"

          for attempt in $(seq 1 18); do
            hcode=$(curl -L --connect-timeout 8 --max-time 15 -sS -o /tmp/health.json -w '%{http_code}' "$HEALTH" || true)
            echo "attempt=$attempt health_http=$hcode"
            if [ "$hcode" = '200' ]; then
              cat /tmp/health.json
              echo
              node -e "const x=require('/tmp/health.json'); console.log('product='+String(x.product||'')); console.log('release_id='+String(x.release?.id||'')); console.log('runtime_class='+String(x.release?.runtimeClass||''));"
              gcode=$(curl -L --connect-timeout 8 --max-time 15 -sS -o /tmp/go-live.json -w '%{http_code}' "$READY" || true)
              echo "go_live_http=$gcode"
              if [ "$gcode" = '200' ]; then
                node -e "const x=require('/tmp/go-live.json'); console.log('readyForPaidTraffic='+String(Boolean(x.readyForPaidTraffic))); console.log('blockers='+(x.blockers||[]).join(','));"
              fi
              exit 0
            fi
            sleep 10
          done

          echo "External backend did not become healthy during the probe window."
          echo "Final health response:"
          head -c 500 /tmp/health.json 2>/dev/null || true
          echo
          exit 1
